# Packaging config for the Autinerary desktop app.
#
# Icons are generated by electron-builder from build/icon.png (1024x1024) —
# one source PNG produces .icns, .ico and the Linux set, so the three
# platforms cannot drift apart.

appId: com.autinerary.desktop
productName: Autinerary
copyright: Autinerary

directories:
  output: dist
  buildResources: build

# Ship only what the app actually runs. node_modules is deliberately absent:
# there are no runtime dependencies — electron and electron-builder are both
# devDependencies — so bundling it would add hundreds of MB of build tooling
# to the installer.
files:
  - main.js
  - preload.js
  - renderer/**/*
  - package.json

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Hardened runtime is required for notarisation. Left ON so the config is
  # correct for real distribution; local unsigned builds still succeed
  # because CSC_IDENTITY_AUTO_DISCOVERY=false skips signing entirely.
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  # Users on shared or managed machines often cannot write to Program Files.
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target: [AppImage]
  category: Utility
