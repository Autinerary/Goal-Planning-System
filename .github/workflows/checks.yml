# The same checks on every change, before it reaches testers (Riipen Labs,
# Group 30, September 2026: "Errors during first use break momentum and trust.
# This is a process issue: changes reach testers without a consistent check").
# What else to check by hand before a release: docs/release-checks.md.
#
# No secrets: the builds use placeholder public values, and the backend tests
# use fakes for the database and the AI.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests (lib/*.test.mjs)
        run: for t in lib/*.test.mjs; do node --experimental-strip-types "$t" || exit 1; done
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  resourcehub:
    name: ResourceHub (types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicehub-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-mvp/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Placeholders, not keys: the build only needs them to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  backend:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
